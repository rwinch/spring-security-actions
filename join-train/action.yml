name: "join-train"
description: "Joins a release of the project to the release train, by running the workflow Release Train - Join (release-train-join.yml) of the project on the release branch"

inputs:
  release-train-repository:
    description: "The release train repository, owner/repo. The workflow of the project is told it."
    required: true
  train-branch:
    description: "The branch of the train, for example 2026.11.19, the output `branch` of `load-train`."
    required: true
  train-found:
    description: "Whether the train exists, the output `found` of `load-train`. If it is `false`, nothing is joined, and the summary says that the train has not been created."
    required: false
    default: "true"
  train-file:
    description: "The file with `train.yml` as JSON, the output `train-file` of `load-train`. A release that has joined in it is not joined again. Required if the train exists."
    required: false
  train-url:
    description: "The URL of the branch of the train, which the summary links to."
    required: false
  project:
    description: "The project id in the release train, for example `spring-security`."
    required: true
  version:
    description: "The version of the release, for example `7.0.1`."
    required: true
  release-repository:
    description: "The repository (owner/repo) of the release branch, which has the workflow release-train-join.yml, for example `spring-projects/spring-security-commercial`."
    required: true
  release-branch:
    description: "The release branch that joins, for example `release/7.0.1`. It must exist, and have the workflow release-train-join.yml: the workflow is run on it."
    required: true
  deployment-destination:
    description: "Where the release is deployed to, as the choice of the workflow Release Train - Join of the project names it: `Maven Central`, `Spring Enterprise` or `Spring Enterprise Extended`."
    required: true
  token:
    description: "A token that may run workflows of the release train repository (Actions: write)."
    required: true

outputs:
  joined:
    description: "true if the Join workflow was run, false if the release had joined already."

runs:
  using: "node24"
  main: "dist/index.js"
