name: "check-not-ready"
description: "Fails if the release train has the release of the project as ready already"

inputs:
  train-file:
    description: "The file with `train.yml` as JSON, the output `train-file` of `load-train`."
    required: true
  project:
    description: "The project id in the release train, for example `spring-security`."
    required: true
  version:
    description: "The version of the release, for example `7.0.1`."
    required: true
  train-branch:
    description: "The branch of the train, for the message."
    required: false
  train-url:
    description: "The URL of the branch of the train. If the release is ready, the summary of the step says so, and the text of its line links to it."
    required: false

outputs:
  status:
    description: "Where the release is in the train: not-joined, joined (and not ready yet) or ready. A ready release fails the action, so it is only seen as ready in the summary"

runs:
  using: "node24"
  main: "dist/index.js"
